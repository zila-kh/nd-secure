name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  rust-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path plugins/tauri-plugin-vault-source/Cargo.toml --all -- --check

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget xdg-utils
      - name: Lint Rust
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: Check Apple Silicon target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Use pinned npm
        run: npm install --global npm@11.19.0
      - name: Install Rust Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [[ -n "$sdk_root" ]] || { echo "Android SDK root is not configured." >&2; exit 1; }
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          fi
          [[ -x "$sdkmanager_bin" ]] || { echo "sdkmanager was not found under $sdk_root." >&2; exit 1; }
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ndk_home="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$ndk_home" || ! -d "$ndk_home" ]]; then
            ndk_home="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          fi
          [[ -n "$ndk_home" && -d "$ndk_home" ]] || { echo "No Android NDK installation was found." >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Initialize Android project
        run: npm run tauri android init -- --ci --skip-targets-install
      - name: Build Android ARM64 debug APK
        run: npm run tauri android build -- --ci --debug --target aarch64 --apk
