name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair_npm_lock:
    if: github.actor != 'github-actions[bot]' && ((github.event_name == 'push' && github.ref == 'refs/heads/agent/encrypted-thumbnails-safe-import-bootstrap') || (github.event_name == 'pull_request' && github.head_ref == 'agent/encrypted-thumbnails-safe-import-bootstrap'))
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: agent/encrypted-thumbnails-safe-import-bootstrap
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Regenerate lockfile from a clean graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile regeneration produced no change." >&2
            exit 1
          fi
          git commit -m "fix: regenerate reproducible npm lockfile"
          git push origin HEAD:agent/encrypted-thumbnails-safe-import-bootstrap

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget xdg-utils
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path plugins/tauri-plugin-vault-source/Cargo.toml --all -- --check
      - name: Lint Rust
        if: runner.os == 'Linux'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - name: Check Apple Silicon target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          cargo check --manifest-path src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Rust Android target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Configure Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          ndk_home="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          [[ -n "$ndk_home" ]] || { echo "No Android NDK installation was found." >&2; exit 1; }
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Initialize Android project
        run: npm run tauri android init -- --ci --skip-targets-install
      - name: Build Android ARM64 debug APK
        run: npm run tauri android build -- --ci --debug --target aarch64 --apk
