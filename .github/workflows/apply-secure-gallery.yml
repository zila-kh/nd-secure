name: Publish validated secure gallery implementation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: secure-gallery-bootstrap
  cancel-in-progress: true

jobs:
  publish-validated-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: agent/encrypted-thumbnails-safe-import-bootstrap

      - name: Verify and apply validated implementation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/nd-secure-bootstrap/part* | tr -d '\n' | base64 --decode > /tmp/nd-secure-feature.tar.gz
          echo "1835996f4ccfc7825d077474ab0db04a2dc651f7b94fa0cb277a7f61dce30777  /tmp/nd-secure-feature.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nd-secure-feature.tar.gz
          rm -f /tmp/nd-secure-feature.tar.gz

          python3 - <<'PY'
          from pathlib import Path

          replacements = (
              (
                  Path("src-tauri/src/gallery/mod.rs"),
                  "pub use repository::{GalleryItem, GalleryObject, GalleryPage, GalleryRepository};",
                  "pub use repository::{GalleryObject, GalleryPage, GalleryRepository};",
                  1,
              ),
              (
                  Path("src-tauri/src/protocol.rs"),
                  ".header(CONTENT_TYPE, metadata.mime_type)",
                  ".header(CONTENT_TYPE, metadata.mime_type.as_str())",
                  1,
              ),
              (
                  Path("src-tauri/src/gallery/container_helpers.rs"),
                  "(total_size + CHUNK_SIZE as u64 - 1) / CHUNK_SIZE as u64",
                  "total_size.div_ceil(CHUNK_SIZE as u64)",
                  1,
              ),
              (
                  Path("src-tauri/src/session.rs"),
                  "derive_domain_key(&*unlocked.master_key, domain)?",
                  "derive_domain_key(&unlocked.master_key, domain)?",
                  1,
              ),
              (
                  Path("src-tauri/src/source.rs"),
                  "    drop(reader);\n",
                  "",
                  2,
              ),
              (
                  Path("src-tauri/src/gallery/thumbnail.rs"),
                  "    fn thumbnail(&self, width: u32, height: u32) -> DynamicImage {\n        self.0.thumbnail(width, height)\n    }",
                  "    fn thumbnail(&self, width: u32, height: u32) -> DynamicImage {\n        let (source_width, source_height) = self.0.dimensions();\n        self.0\n            .thumbnail(width.min(source_width), height.min(source_height))\n    }",
                  1,
              ),
          )

          for path, old, new, expected_count in replacements:
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != expected_count:
                  raise SystemExit(
                      f"expected {expected_count} validated patch target(s) in {path}, found {count}"
                  )
              path.write_text(content.replace(old, new), encoding="utf-8")
          PY

          # Workflow files are finalized separately through the repository API,
          # because GITHUB_TOKEN cannot publish workflow-file changes here.
          git restore --source=HEAD --worktree -- .github/workflows
          rm -rf .github/nd-secure-bootstrap
          test -f src-tauri/src/gallery/thumbnail.rs
          test -f src/lib/components/SettingsView.svelte
          test -f SECURITY.md

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Install Rust formatting toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Generate reproducible lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Apply validated formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path plugins/tauri-plugin-vault-source/Cargo.toml --all

      - name: Validate publication hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f package-lock.json
          test -f src-tauri/Cargo.lock
          ! test -e .github/nd-secure-bootstrap
          git diff --exit-code -- .github/workflows

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Publication produced no implementation changes." >&2
            exit 1
          fi
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "Refusing to publish workflow-file changes through GITHUB_TOKEN." >&2
            exit 1
          fi
          git commit -m "feat: add encrypted thumbnails and verified source handling"
          git push origin HEAD:agent/encrypted-thumbnails-safe-import-bootstrap
