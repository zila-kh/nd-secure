name: Inspect legacy thumbnail backfill

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secure-gallery-bootstrap
  cancel-in-progress: true

jobs:
  inspect-backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: agent/encrypted-thumbnails-safe-import-bootstrap

      - name: Extract and inspect legacy thumbnail code
        shell: bash
        run: |
          set -euo pipefail
          cat .github/nd-secure-bootstrap/part* | tr -d '\n' | base64 --decode > /tmp/nd-secure-feature.tar.gz
          echo "1835996f4ccfc7825d077474ab0db04a2dc651f7b94fa0cb277a7f61dce30777  /tmp/nd-secure-feature.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nd-secure-feature.tar.gz
          rm -f /tmp/nd-secure-feature.tar.gz

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/gallery/repository.rs")
          lines = path.read_text(encoding="utf-8").splitlines()
          terms = (
              "missing_legacy_thumbnail",
              "backfill",
              "thumbnail_width",
              "thumbnail_height",
              "thumbnail_dimensions",
              "ensure_thumbnail",
              "generate_thumbnail",
          )

          matched = []
          for index, line in enumerate(lines):
              if any(term in line for term in terms):
                  matched.append(index)

          print("=== matching lines ===")
          for index in matched:
              print(f"{index + 1}: {lines[index]}")

          print("=== contextual source ===")
          emitted = set()
          for index in matched:
              start = max(0, index - 45)
              end = min(len(lines), index + 70)
              for line_number in range(start, end):
                  if line_number not in emitted:
                      print(f"{line_number + 1:04d}: {lines[line_number]}")
                      emitted.add(line_number)
              print("---")
          PY

          exit 1
