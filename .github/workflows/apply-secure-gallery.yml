name: Inspect thumbnail generator

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secure-gallery-bootstrap
  cancel-in-progress: true

jobs:
  inspect-generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: agent/encrypted-thumbnails-safe-import-bootstrap

      - name: Extract and inspect thumbnail generator
        shell: bash
        run: |
          set -euo pipefail
          cat .github/nd-secure-bootstrap/part* | tr -d '\n' | base64 --decode > /tmp/nd-secure-feature.tar.gz
          echo "1835996f4ccfc7825d077474ab0db04a2dc651f7b94fa0cb277a7f61dce30777  /tmp/nd-secure-feature.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nd-secure-feature.tar.gz
          rm -f /tmp/nd-secure-feature.tar.gz
          nl -ba src-tauri/src/gallery/thumbnail.rs
          exit 1
