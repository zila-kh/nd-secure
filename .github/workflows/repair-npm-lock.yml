name: Repair npm lockfile

on:
  push:
    branches: [agent/encrypted-thumbnails-safe-import-bootstrap]
    paths:
      - .github/workflows/repair-npm-lock.yml

permissions:
  contents: write

concurrency:
  group: repair-nd-secure-npm-lock
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: agent/encrypted-thumbnails-safe-import-bootstrap

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Regenerate lockfile from a clean graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install and frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile regeneration produced no change." >&2
            exit 1
          fi
          git commit -m "fix: regenerate reproducible npm lockfile"
          git push origin HEAD:agent/encrypted-thumbnails-safe-import-bootstrap
