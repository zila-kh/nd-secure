[package]
name = "nd-secure"
version = "0.1.0"
description = "Local-first encrypted gallery and password vault"
authors = ["zila-kh"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nd_secure_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = { version = "0.10", features = ["aes"] }
argon2 = "0.5"
base64 = "0.22"
data-encoding = "2.6"
hkdf = "0.12"
hmac = "0.12"
parking_lot = "0.12"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
tauri-plugin-vault-source = { path = "../plugins/tauri-plugin-vault-source" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
